<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260"><rect width="900" height="260" rx="18" fill="#f5f8fa"/><text x="32" y="40" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#20394c">Fibonacci: move forward one pair at a time</text><rect x="32" y="90" width="190" height="85" rx="12" fill="#e2eff6" stroke="#a9c3d1"/><text x="127" y="138.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#20394c">a = 0, b = 1</text><path d="M236 133 h55 m-12 -10 l12 10 -12 10" fill="none" stroke="#648ca2" stroke-width="3"/><rect x="335" y="90" width="220" height="85" rx="12" fill="#fff0d7" stroke="#a9c3d1"/><text x="445" y="138.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#20394c">next = a + b</text><path d="M570 133 h55 m-12 -10 l12 10 -12 10" fill="none" stroke="#648ca2" stroke-width="3"/><rect x="675" y="90" width="190" height="85" rx="12" fill="#e4f3e9" stroke="#a9c3d1"/><text x="770" y="138.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#20394c">a = b, b = next</text><text x="42" y="223" font-family="Arial" font-size="19" fill="#42647a">0, 1, 1, 2, 3, 5, 8, 13 …</text></svg>