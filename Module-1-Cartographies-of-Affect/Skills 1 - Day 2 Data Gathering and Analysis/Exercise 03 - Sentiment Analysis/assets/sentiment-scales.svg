<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#202020}.title{font-size:52px;font-weight:600}.heading{font-size:38px;font-weight:600}.label{font-size:29px}.small{font-size:25px}.mono{font-family:Consolas,monospace;font-size:25px}.line{fill:none;stroke:#222;stroke-width:4}.fine{stroke:#bbb;stroke-width:2}.panel{fill:#f5f5f5;stroke:#ccc;stroke-width:2}.note{fill:#666;font-size:29px}</style><rect width="1600" height="900" fill="#f8f8f8"/><rect x="45" y="40" width="1510" height="690" fill="none" stroke="#ddd" stroke-width="3"/><text x="800" y="125" text-anchor="middle" class="title">Two ways of describing sentiment</text><path d="M800 165 V720" class="fine"/><text x="420" y="232" text-anchor="middle" class="heading">Polarity</text><text x="420" y="280" text-anchor="middle" class="small">negative ← neutral → positive</text><line x1="160" y1="420" x2="680" y2="420" class="line"/><g class="line"><path d="M160 405 V435 M420 405 V435 M680 405 V435"/></g><text x="160" y="475" text-anchor="middle" class="label">−1</text><text x="420" y="475" text-anchor="middle" class="label">0</text><text x="680" y="475" text-anchor="middle" class="label">+1</text><rect x="105" y="530" width="630" height="120" rx="12" class="panel"/><text x="420" y="575" text-anchor="middle" class="small">Direction and strength of sentiment</text><text x="420" y="615" text-anchor="middle" class="mono">TextBlob(...).sentiment.polarity</text><text x="1190" y="232" text-anchor="middle" class="heading">Subjectivity</text><text x="1190" y="280" text-anchor="middle" class="small">more objective ← → more subjective</text><line x1="920" y1="420" x2="1450" y2="420" class="line"/><g class="line"><path d="M920 405 V435 M1450 405 V435"/></g><text x="920" y="475" text-anchor="middle" class="label">0</text><text x="1450" y="475" text-anchor="middle" class="label">1</text><rect x="865" y="530" width="630" height="120" rx="12" class="panel"/><text x="1180" y="575" text-anchor="middle" class="small">Estimated opinion-like language</text><text x="1180" y="615" text-anchor="middle" class="mono">TextBlob(...).sentiment.subjectivity</text><text x="105" y="807" class="note">These are estimates from language, not measurements of a person's emotions.</text></svg>