<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#202020}.title{font-size:47px;font-weight:600}.label{font-size:30px}.small{font-size:24px}.mono{font-family:Consolas,Menlo,monospace;font-size:25px}.note{font-size:30px;fill:#666}.line{fill:none;stroke:#202020;stroke-width:4}.fine{fill:none;stroke:#999;stroke-width:2}.node{fill:#f6f6f6;stroke:#202020;stroke-width:3}.panel{fill:#f1f1f1;stroke:#ccc;stroke-width:2}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#202020"/></marker></defs><rect width="1600" height="900" fill="#f8f8f8"/><rect x="45" y="40" width="1510" height="690" fill="none" stroke="#ddd" stroke-width="3"/><text x="800" y="117" text-anchor="middle" class="title">Nested Flickr JSON response</text><rect x="90" y="180" width="360" height="90" rx="10" class="node"/><text x="270" y="235" text-anchor="middle" class="label">photos</text><rect x="90" y="340" width="360" height="90" rx="10" class="node"/><text x="270" y="397" text-anchor="middle" class="mono">photos["photos"]</text><path d="M270 270 L270 338" class="line" marker-end="url(#a)"/><rect x="550" y="185" width="410" height="100" rx="10" class="node"/><text x="755" y="228" text-anchor="middle" class="small">"page"  ·  current page</text><text x="755" y="260" text-anchor="middle" class="small">"pages"  ·  total pages</text><rect x="550" y="340" width="410" height="90" rx="10" class="node"/><text x="755" y="394" text-anchor="middle" class="small">"photo"  ·  list of photos</text><path d="M450 385 L548 385" class="line" marker-end="url(#a)"/><rect x="1030" y="300" width="430" height="100" rx="10" class="node"/><text x="1245" y="357" text-anchor="middle" class="mono">photo_list[0]</text><text x="1245" y="386" text-anchor="middle" class="small">First photograph</text><path d="M960 385 L1027 352" class="line" marker-end="url(#a)"/><rect x="1030" y="480" width="430" height="110" rx="10" class="node"/><text x="1245" y="532" text-anchor="middle" class="mono">first_photo["title"]</text><text x="1245" y="567" text-anchor="middle" class="small">Value in the dictionary</text><path d="M1245 400 L1245 477" class="line" marker-end="url(#a)"/><text x="120" y="792" text-anchor="start" class="note">Strings select dictionary keys; integers select positions in a list.</text></svg>